<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restaurant Menu</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #071426;
      color: white;
      min-height: 100vh;
    }

    .container {
      width: 95%;
      max-width: 900px;
      margin: auto;
      padding: 20px 0 40px;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
      font-size: 30px;
    }

    .customer-box {
      background: #102b4b;
      padding: 18px;
      border-radius: 15px;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    input,
    select {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      margin-bottom: 12px;
    }

    .menu {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .item {
      background: #12365c;
      padding: 15px;
      border-radius: 15px;
    }

    .item h3 {
      margin-bottom: 8px;
      font-size: 19px;
    }

    .price {
      color: #ffd43b;
      font-size: 17px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    button {
      border: none;
      cursor: pointer;
      border-radius: 8px;
      padding: 10px 15px;
      font-size: 15px;
      font-weight: bold;
    }

    .add-btn {
      background: #ffd43b;
      color: #111;
      width: 100%;
    }

    .cart {
      background: #102b4b;
      margin-top: 25px;
      padding: 18px;
      border-radius: 15px;
    }

    .cart h2 {
      margin-bottom: 15px;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #163d65;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 8px;
    }

    .qty-buttons button {
      padding: 5px 9px;
      margin-left: 4px;
      background: white;
      color: black;
    }

    .total {
      font-size: 20px;
      font-weight: bold;
      margin: 18px 0;
      color: #ffd43b;
    }

    .order-btn {
      width: 100%;
      background: #22c55e;
      color: white;
      padding: 14px;
      font-size: 17px;
    }

    .message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      display: none;
      background: #0b5;
    }

    @media (max-width: 600px) {
      .menu {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 25px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🍽️ Restaurant Menu</h1>

  <div class="customer-box">

    <label>Table Number</label>

    <select id="table">
      <option value="1">Table 1</option>
      <option value="2">Table 2</option>
      <option value="3">Table 3</option>
      <option value="4">Table 4</option>
      <option value="5">Table 5</option>
      <option value="6">Table 6</option>
      <option value="7">Table 7</option>
      <option value="8">Table 8</option>
      <option value="9">Table 9</option>
      <option value="10">Table 10</option>
    </select>

    <label>Customer Name</label>

    <input
      type="text"
      id="customerName"
      placeholder="Enter your name"
    >

  </div>


  <div class="menu">

    <div class="item">
      <h3>🍔 Veg Burger</h3>
      <div class="price">₹129</div>
      <button class="add-btn"
        onclick="addItem('Veg Burger',129)">
        Add
      </button>
    </div>

    <div class="item">
      <h3>🍕 Pizza</h3>
      <div class="price">₹199</div>
      <button class="add-btn"
        onclick="addItem('Pizza',199)">
        Add
      </button>
    </div>

    <div class="item">
      <h3>🍟 French Fries</h3>
      <div class="price">₹89</div>
      <button class="add-btn"
        onclick="addItem('French Fries',89)">
        Add
      </button>
    </div>

    <div class="item">
      <h3>🍛 Biryani</h3>
      <div class="price">₹249</div>
      <button class="add-btn"
        onclick="addItem('Biryani',249)">
        Add
      </button>
    </div>

    <div class="item">
      <h3>🥤 Cold Drink</h3>
      <div class="price">₹50</div>
      <button class="add-btn"
        onclick="addItem('Cold Drink',50)">
        Add
      </button>
    </div>

    <div class="item">
      <h3>🍦 Ice Cream</h3>
      <div class="price">₹99</div>
      <button class="add-btn"
        onclick="addItem('Ice Cream',99)">
        Add
      </button>
    </div>

  </div>


  <div class="cart">

    <h2>🛒 Your Cart</h2>

    <div id="cartItems">
      Cart is empty
    </div>

    <div class="total">
      Total: ₹<span id="total">0</span>
    </div>

    <button class="order-btn" onclick="placeOrder()">
      Place Order
    </button>

    <div id="message" class="message"></div>

  </div>

</div>


<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbz2JOl6OJ99iha5szGccglntfRAqKpDaPerVaGyBgnjYJzgvJZ5_-YOc12aps8bziA/exec";


let cart = [];


// QR se table number lena
const params =
new URLSearchParams(window.location.search);

const qrTable =
params.get("table");

if (qrTable) {

  const tableSelect =
  document.getElementById("table");

  tableSelect.value = qrTable;

  tableSelect.disabled = true;

}


// Item add karna
function addItem(name, price) {

  const existing =
  cart.find(item => item.name === name);

  if (existing) {

    existing.qty++;

  } else {

    cart.push({
      name: name,
      price: price,
      qty: 1
    });

  }

  updateCart();

}


// Quantity change
function changeQty(index, amount) {

  cart[index].qty += amount;

  if (cart[index].qty <= 0) {

    cart.splice(index, 1);

  }

  updateCart();

}


// Cart update
function updateCart() {

  const cartItems =
  document.getElementById("cartItems");

  const totalElement =
  document.getElementById("total");


  if (cart.length === 0) {

    cartItems.innerHTML =
    "Cart is empty";

    totalElement.innerText =
    "0";

    return;

  }


  let html = "";

  let total = 0;


  cart.forEach((item, index) => {

    total +=
    item.price * item.qty;


    html += `

      <div class="cart-item">

        <div>
          <strong>${item.name}</strong>
          <br>
          ₹${item.price} × ${item.qty}
        </div>

        <div class="qty-buttons">

          <button
            onclick="changeQty(${index},-1)">
            −
          </button>

          <button
            onclick="changeQty(${index},1)">
            +
          </button>

        </div>

      </div>

    `;

  });


  cartItems.innerHTML =
  html;

  totalElement.innerText =
  total;

}


// Order place karna
async function placeOrder() {

  const customerName =
  document
  .getElementById("customerName")
  .value
  .trim();


  const table =
  document
  .getElementById("table")
  .value;


  if (!customerName) {

    alert(
      "Please enter customer name."
    );

    return;

  }


  if (cart.length === 0) {

    alert(
      "Please add at least one item."
    );

    return;

  }


  let total = 0;


  cart.forEach(item => {

    total +=
    item.price * item.qty;

  });


  const order = {

    table: table,

    customerName:
    customerName,

    items:
    cart.map(item => ({

      name: item.name,

      qty: item.qty,

      price: item.price

    })),

    total: total

  };


  const message =
  document.getElementById("message");


  message.style.display =
  "block";

  message.innerText =
  "⏳ Placing order...";


  try {

    const response =
    await fetch(API_URL, {

      method: "POST",

      body:
      JSON.stringify(order)

    });


    const result =
    await response.json();


    if (result.success) {

      message.innerText =
      "✅ Order placed successfully! Order ID: "
      + result.orderId;


      cart = [];

      updateCart();


      document
      .getElementById("customerName")
      .value = "";


    } else {

      message.innerText =
      "❌ " + result.message;

    }


  } catch (error) {

    message.innerText =
    "❌ Order failed. Please try again.";

    console.error(error);

  }

}


updateCart();

</script>

</body>
</html>
